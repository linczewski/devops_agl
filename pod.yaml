apiVersion: v1
kind: Pod
metadata:
  name: agl-build
spec:
  securityContext:
    runAsUser: $AGL_UID
    runAsGroup: $AGL_GID
    supplementalGroups:
      - 0
  containers:
    - name: builder
      image: agl
      command: ["bash", "--rcfile", "./rcfile.sh"]
      tty: true
      stdin: true
      volumeMounts:
        - name: downloads
          mountPath: /home/agl/downloads
        - name: deploy
          mountPath: /home/agl/deploy
        - name: tmp
          mountPath: /tmp/salmon
      env:
        - name: TERM
          value: xterm
  volumes:
    - name: downloads
      hostPath:
        path: $PROJECT_ROOT/downloads
        type: DirectoryOrCreate
    - name: deploy
      hostPath:
        path: $PROJECT_ROOT/deploy
        type: DirectoryOrCreate
    - name: tmp
      hostPath:
        path: $TMP_HOST_PATH
        type: DirectoryOrCreate
  restartPolicy: Never
